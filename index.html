<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lottas Vokabel-Heldin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Lottas Vokabel-Heldin</h1>
        </header>
        
        <div class="score-board">
            <div class="score-item">
                <span class="label">Punkte</span>
                <span id="score" class="value">0</span>
            </div>
            <div id="grade" class="value">Level: Newbie</div>
            <button class="btn-reset" onclick="resetPoints()">🔄 Reset</button>
        </div>

        <div id="menu-view" class="glass-panel">
            <h3>Hauptmenü</h3>
            <button class="btn-menu" onclick="startAll()">📚 Alle Vokabeln</button>
            <button class="btn-menu" onclick="showSelection()">🎯 Kapitel wählen</button>
            <button id="error-btn-menu" class="btn-menu btn-error" onclick="startErrorMode()" style="display:none;">⚠️ Nur Stolperwörter</button>
        </div>

        <div id="selection-view" class="glass-panel" style="display:none;">
            <div class="view-header">
                <button class="btn-back" onclick="showMenu()">⬅ Zurück</button>
                <h3>Wähle Kapitel</h3>
            </div>
            <div id="selection-list" class="scroll-list"></div>
            <button class="btn correct" style="width:100%" onclick="startSelected()">Start 🚀</button>
        </div>

        <div id="trainer-view" style="display:none;">
            <div class="view-header">
                <button class="btn-back" onclick="showMenu()">🏠 Menü</button>
                <span id="mode-indicator" style="font-size: 0.8rem; opacity: 0.6;"></span>
            </div>
            <div class="card-container" id="card-container">
                <div class="card" id="card">
                    <div class="card-face front">
                        <div id="front-text">Lade...</div>
                        <div class="hint">Klicken zum Drehen</div>
                    </div>
                    <div class="card-face back">
                        <div id="back-text">Loading...</div>
                    </div>
                </div>
            </div>
            <div class="controls">
                <button class="btn wrong" onclick="nextCard(false)">❌ Noch mal</button>
                <button class="btn correct" onclick="nextCard(true)">Gewusst! ✅</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
