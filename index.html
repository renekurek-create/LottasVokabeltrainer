<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lottas Vokabel-Heldin</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Lottas Vokabel-Heldin</h1>
        </header>
        
        <div class="score-board">
            <div id="avatar-container" class="avatar">🐛</div>
            <div class="score-item">
                <span class="label">Punkte</span>
                <span id="score" class="value">0</span>
            </div>
            <div class="score-item">
                <span class="label">Streak</span>
                <span id="streak" class="value" style="color:var(--accent)">0</span>
            </div>
            <div class="score-item">
                <span id="grade" class="value" style="font-size: 0.9rem;">Newbie</span>
            </div>
            <button class="btn-reset" onclick="resetPoints()">🔄</button>
        </div>

        <div id="progress-container" style="display:none; width:100%; height:8px; background:rgba(255,255,255,0.1); border-radius:10px; margin-bottom:30px; overflow:hidden;">
            <div id="progress-bar" style="width:0%; height:100%; background:var(--success); transition:0.3s;"></div>
        </div>

        <div id="menu-view" class="glass-panel">
            <h3>Wähle deinen Modus:</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <button id="mode-flash-btn" class="btn-menu" onclick="setMode('flashcard')">📇 Karten</button>
                <button id="mode-quiz-btn" class="btn-menu" onclick="setMode('quiz')">❓ Quiz</button>
            </div>
            <hr style="opacity:0.1; margin: 25px 0;">
            <button class="btn-menu" onclick="startAll()">📚 Alle Vokabeln</button>
            <button class="btn-menu" onclick="showSelection()">🎯 Kapitel wählen</button>
            <button id="error-btn-menu" class="btn-menu btn-error" onclick="startErrorMode()" style="display:none;">⚠️ Stolperwörter</button>
        </div>

        <div id="selection-view" class="glass-panel" style="display:none;">
            <div class="view-header" style="display:flex; justify-content:space-between; align-items:center;">
                <button class="btn-back" onclick="showMenu()">⬅ Zurück</button>
                <h3 style="margin:0;">Kapitel</h3>
            </div>
            <div id="selection-list" class="scroll-list"></div>
            <button class="btn correct" style="width:100%" onclick="startSelected()">Start 🚀</button>
        </div>

        <div id="flashcard-view" style="display:none;">
            <div class="view-header" style="display:flex; justify-content:space-between; margin-bottom:15px;">
                <button class="btn-back" onclick="showMenu()">🏠 Menü</button>
                <span id="mode-ind-1" style="font-size: 0.8rem; opacity: 0.6;"></span>
            </div>
            <div class="card-container" onclick="flipCard()">
                <div class="card" id="card">
                    <div class="card-face front">
                        <div id="front-text">Lade...</div>
                        <div class="hint">Klicken zum Drehen</div>
                    </div>
                    <div class="card-face back">
                        <div id="back-text">Loading...</div>
                    </div>
                </div>
            </div>
            <div class="controls">
                <button class="btn wrong" onclick="nextCard(false)">❌ Noch mal</button>
                <button class="btn correct" onclick="nextCard(true)">Gewusst! ✅</button>
            </div>
        </div>

        <div id="quiz-view" style="display:none;">
            <div class="view-header" style="display:flex; justify-content:space-between; margin-bottom:15px;">
                <button class="btn-back" onclick="showMenu()">🏠 Menü</button>
                <span id="mode-ind-2" style="font-size: 0.8rem; opacity: 0.6;"></span>
            </div>
            <div class="glass-panel quiz-question-panel">
                <div id="quiz-question">Wort</div>
            </div>
            <div id="quiz-options">
                </div>
        </div>
    </div>

    <audio id="snd-correct" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>

    <script src="script.js"></script>
</body>
</html>
