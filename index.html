<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lottas Vokabel-Heldin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Lottas Vokabel-Heldin</h1>
        </header>
        
        <div class="score-board">
            <div class="score-item">
                <span class="label">Punkte</span>
                <span id="score" class="value">0</span>
            </div>
            <div id="grade" class="value">Level: Newbie</div>
            <button class="btn-reset" onclick="resetPoints()">🔄 Reset</button>
        </div>

        <div id="menu-view" class="glass-panel">
            <h3>Was möchtest du üben?</h3>
            <button class="btn-menu" onclick="startAll()">📚 Alle Vokabeln</button>
            <button class="btn-menu" onclick="showSelection()">🎯 Gezielte Auswahl</button>
            <button id="error-btn-menu" class="btn-menu" onclick="startErrorMode()" style="display:none;">⚠️ Nur Fehler</button>
        </div>

        <div id="selection-view" class="glass-panel" style="display:none;">
            <h3>Wähle deine Wörter:</h3>
            <div id="selection-list" class="scroll-list"></div>
            <button class="btn correct" style="width:100%" onclick="startSelected()">Auswahl starten 🚀</button>
        </div>

        <div id="trainer-view" style="display:none;">
            <div class="card-container" id="card-container">
                <div class="card" id="card">
                    <div class="card-face front">
                        <div id="front-text">Lade...</div>
                        <div class="hint">Klicken zum Drehen</div>
                    </div>
                    <div class="card-face back">
                        <div id="back-text">Loading...</div>
                    </div>
                </div>
            </div>
            <div class="controls">
                <button class="btn wrong" onclick="nextCard(false)">❌ Noch mal</button>
                <button class="btn correct" onclick="nextCard(true)">Gewusst! ✅</button>
            </div>
            <button class="btn-menu" style="margin-top:20px; opacity:0.7" onclick="showMenu()">🏠 Zum Menü</button>
        </div>

        <div id="error-view" class="glass-panel" style="display:none;">
            <h2>Deine Stolperwörter</h2>
            <div id="error-list" class="scroll-list"></div>
            <button class="btn correct" style="width:100%" onclick="showMenu()">Zurück zum Menü</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
