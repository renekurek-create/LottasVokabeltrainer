<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lottas Vokabel-Heldin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Lottas Vokabel-Heldin</h1>
        </header>
        
        <div class="score-board">
            <div class="score-item">
                <span class="label">Punkte</span>
                <span id="score" class="value">0</span>
            </div>
            <div class="score-item">
                <span class="label">Status</span>
                <span id="grade" class="value">Start!</span>
            </div>
            <button class="btn-reset" onclick="resetPoints()">🔄 Reset</button>
        </div>

        <div class="card-container" id="card-container">
            <div class="card" id="card">
                <div class="card-face front">
                    <div id="front-text">Lade...</div>
                    <div class="hint">Klicken zum Drehen</div>
                </div>
                <div class="card-face back">
                    <div id="back-text">Loading...</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn wrong" onclick="nextCard(false)">❌ Noch mal</button>
            <button class="btn correct" onclick="nextCard(true)">Gewusst! ✅</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
